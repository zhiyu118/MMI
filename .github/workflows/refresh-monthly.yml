name: Refresh monthly data sources

on:
  schedule:
    - cron: "0 12 5 * *"  # 5th of each month — BLS LAUS's monthly release, and HRSA HPSA (no fixed date of its own, but drifts too fast for the annual schedule)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_all.py monthly
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          git diff --staged --quiet || git commit -m "Refresh monthly data sources"
          git push
